<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Track Order — La Belle Époque Nairobi</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .track-wrap { max-width: 720px; margin: 4rem auto; padding: 0 2rem; }
    .track-wrap h1 { font-size: 2.6rem; color: var(--wine); margin-bottom: 0.5rem; }
    .track-wrap > p { color: var(--muted); margin-bottom: 2rem; }
    .search-box { display: flex; gap: 0.5rem; margin-bottom: 2rem; }
    .search-box input { flex: 1; padding: 0.9rem 1.2rem; border: 1px solid var(--line); font-family: inherit; background: #fff; font-size: 1rem; }
    .search-box button { padding: 0.9rem 1.8rem; background: var(--gold); border: 1px solid var(--gold); color: var(--ink); font-family: inherit; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.15em; cursor: pointer; }
    .search-box button:hover { background: transparent; color: var(--gold); }

    .status-card { background: #fff; border: 1px solid var(--line); padding: 2rem; margin-bottom: 1.5rem; }
    .status-card h2 { font-size: 1.6rem; margin-bottom: 1rem; color: var(--wine); }

    .steps { display: flex; justify-content: space-between; margin: 2rem 0 1rem; position: relative; }
    .steps::before { content: ''; position: absolute; top: 18px; left: 20px; right: 20px; height: 2px; background: var(--line); z-index: 0; }
    .step { text-align: center; flex: 1; position: relative; z-index: 1; }
    .step .dot { width: 36px; height: 36px; border-radius: 50%; background: #fff; border: 2px solid var(--line); margin: 0 auto 0.6rem; display: flex; align-items: center; justify-content: center; font-weight: 600; color: var(--muted); font-size: 0.85rem; }
    .step.done .dot { background: var(--gold); border-color: var(--gold); color: var(--ink); }
    .step.current .dot { background: var(--wine); border-color: var(--wine); color: #fff; }
    .step .label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
    .step.done .label, .step.current .label { color: var(--ink); font-weight: 600; }

    .order-line { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px dashed var(--line); }
    .order-line:last-child { border-bottom: none; }
    .total-line { font-weight: 700; font-size: 1.1rem; padding-top: 1rem; }

    .history-list { list-style: none; }
    .history-list li { display: flex; gap: 1rem; padding: 0.8rem 0; border-bottom: 1px solid var(--line); font-size: 0.9rem; }
    .history-list li:last-child { border-bottom: none; }
    .history-list .time { color: var(--muted); font-size: 0.8rem; min-width: 130px; }
    .history-list .status { font-weight: 600; color: var(--wine); }

    .not-found { background: #f8d7da; color: #721c24; padding: 1.5rem; border-radius: var(--radius); }
  </style>
</head>
<body>
  <header class="nav">
    <a class="brand" href="/">La Belle Époque</a>
    <nav>
      <a href="/">Home</a>
      <a href="/menu.html">Menu</a>
      <a href="/reservations.html">Reservations</a>
      <a href="/order.html">Order</a>
      <a href="/about.html">About</a>
      <a href="/track.html" class="active">Track Order</a>
    </nav>
  </header>

  <div class="track-wrap">
    <h1>Track Your Order</h1>
    <p>Enter your order number to see live progress.</p>
    <form class="search-box" id="track-form">
      <input id="track-input" placeholder="e.g. LB-XXXXXX-XXXXXX" required />
      <button type="submit">Track</button>
    </form>
    <div id="result"></div>
  </div>

  <script>
    const STEPS = [
      { key: 'pending', label: 'Received' },
      { key: 'confirmed', label: 'Confirmed' },
      { key: 'preparing', label: 'Preparing' },
      { key: 'ready', label: 'Ready' },
      { key: 'out_for_delivery', label: 'On the way' },
      { key: 'delivered', label: 'Delivered' },
    ];

    const orderFromUrl = new URLSearchParams(location.search).get('order');
    if (orderFromUrl) {
      document.getElementById('track-input').value = orderFromUrl;
      track(orderFromUrl);
    }

    document.getElementById('track-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const v = document.getElementById('track-input').value.trim();
      if (v) { history.replaceState(null, '', '?order=' + encodeURIComponent(v)); track(v); }
    });

    async function track(orderNumber) {
      const box = document.getElementById('result');
      box.innerHTML = '<p style="color:var(--muted);">Looking up your order…</p>';
      try {
        const res = await fetch('/api/track/' + encodeURIComponent(orderNumber));
        if (!res.ok) {
          box.innerHTML = '<div class="not-found">We could not find that order. Check the number and try again.</div>';
          return;
        }
        const { order, items, history } = await res.json();
        box.innerHTML = renderOrder(order, items, history);
        if (!['delivered','completed','cancelled'].includes(order.status)) {
          setTimeout(() => track(orderNumber), 20000);
        }
      } catch (e) {
        box.innerHTML = '<div class="not-found">Error loading order. Try again.</div>';
      }
    }

    function renderOrder(o, items, history) {
      const isCancelled = o.status === 'cancelled';
      let stepIndex = STEPS.findIndex(s => s.key === o.status);
      if (['completed','delivered'].includes(o.status)) stepIndex = STEPS.length - 1;

      const stepsHtml = STEPS.map((s, i) => {
        const cls = isCancelled ? '' : (i < stepIndex ? 'done' : i === stepIndex ? 'current' : '');
        return `<div class="step ${cls}"><div class="dot">${i + 1}</div><div class="label">${s.label}</div></div>`;
      }).join('');

      const itemsHtml = items.map(i =>
        `<div class="order-line"><span>${i.quantity}× ${i.item_name}</span><span>KES ${(i.unit_price * i.quantity).toFixed(2)}</span></div>`
      ).join('');

      const historyHtml = history.map(h => `
        <li>
          <span class="time">${new Date(h.created_at).toLocaleString('en-KE')}</span>
          <span><span class="status">${h.status.replace(/_/g, ' ')}</span>${h.note ? ' — ' + h.note : ''}</span>
        </li>
      `).join('') || '<li style="color:var(--muted);">No updates yet.</li>';

      return `
        <div class="status-card">
          <h2>Order ${o.order_number}</h2>
          <p style="color:var(--muted);font-size:0.9rem;">Placed ${new Date(o.created_at).toLocaleString('en-KE')} · ${o.fulfillment === 'delivery' ? 'Delivery' : 'Pickup'}</p>
          ${isCancelled
            ? '<p style="color:var(--wine);font-weight:700;margin-top:1rem;">This order has been cancelled.</p>'
            : `<div class="steps">${stepsHtml}</div>`}
        </div>
        <div class="status-card">
          <h2>Items</h2>
          ${itemsHtml}
          <div class="order-line total-line"><span>Total</span><span>KES ${Number(o.total).toFixed(2)}</span></div>
        </div>
        <div class="status-card">
          <h2>Updates</h2>
          <ul class="history-list">${historyHtml}</ul>
        </div>
      `;
    }
  </script>
</body>
</html>
