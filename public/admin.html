<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — La Belle Époque</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body { background: #f0ebe0; }

    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .login-card {
      background: #fff;
      padding: 3rem;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      box-shadow: 0 30px 60px -20px rgba(0,0,0,0.15);
      max-width: 420px;
      width: 100%;
    }
    .login-card h1 {
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
      color: var(--wine);
    }
    .login-card p {
      color: var(--muted);
      margin-bottom: 2rem;
      font-size: 0.9rem;
    }
    .login-card label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 0.4rem;
      color: var(--muted);
    }
    .login-card input {
      width: 100%;
      padding: 0.8rem;
      border: 1px solid var(--line);
      font-family: inherit;
      margin-bottom: 1.2rem;
      background: var(--cream);
    }
    .login-card input:focus {
      outline: none;
      border-color: var(--gold);
    }
    .login-card button {
      width: 100%;
      padding: 1rem;
      background: var(--gold);
      border: 1px solid var(--gold);
      color: var(--ink);
      font-family: inherit;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      cursor: pointer;
      transition: all 0.2s;
    }
    .login-card button:hover {
      background: transparent;
      color: var(--gold);
    }
    .login-card .error {
      color: var(--wine);
      font-size: 0.9rem;
      margin-bottom: 1rem;
      font-weight: 600;
    }

    .dash {
      display: none;
      min-height: 100vh;
    }
    .dash.visible { display: block; }

    .dash-header {
      background: var(--ink);
      color: var(--cream);
      padding: 1rem 4vw;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .dash-header .brand {
      color: var(--gold);
      font-size: 1.4rem;
      font-family: 'Cormorant Garamond', serif;
      text-decoration: none;
    }
    .dash-header .user {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      font-size: 0.85rem;
    }
    .dash-header button {
      background: transparent;
      border: 1px solid var(--cream);
      color: var(--cream);
      padding: 0.5rem 1rem;
      font-family: inherit;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
    }
    .dash-header button:hover { background: var(--cream); color: var(--ink); }

    .tabs {
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: 0 4vw;
      display: flex;
      gap: 0;
      overflow-x: auto;
    }
    .tabs button {
      padding: 1.2rem 1.8rem;
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      font-family: inherit;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      cursor: pointer;
      color: var(--muted);
      white-space: nowrap;
    }
    .tabs button:hover { color: var(--ink); }
    .tabs button.active {
      color: var(--wine);
      border-bottom-color: var(--gold);
      font-weight: 600;
    }

    .tab-content {
      display: none;
      padding: 2.5rem 4vw;
      max-width: 1200px;
      margin: 0 auto;
    }
    .tab-content.active { display: block; }

    .tab-content h2 {
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
      color: var(--wine);
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border: 1px solid var(--line);
      font-size: 0.88rem;
    }
    .data-table th, .data-table td {
      padding: 0.8rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--line);
    }
    .data-table th {
      background: var(--ink);
      color: var(--cream);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 600;
    }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tr:hover td { background: #faf6ee; }

    .status-pill {
      display: inline-block;
      padding: 0.25rem 0.7rem;
      border-radius: 20px;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
    }
    .status-confirmed, .status-completed, .status-ready { background: #d4edda; color: #155724; }
    .status-pending, .status-preparing { background: #fff3cd; color: #856404; }
    .status-cancelled { background: #f8d7da; color: #721c24; }
    .status-seated, .status-out_for_delivery { background: #cce5ff; color: #004085; }

    .status-select {
      padding: 0.4rem;
      border: 1px solid var(--line);
      font-family: inherit;
      font-size: 0.8rem;
      background: var(--cream);
    }

    .loading, .empty {
      padding: 2rem;
      text-align: center;
      color: var(--muted);
      background: #fff;
      border: 1px solid var(--line);
    }

    .edit-form {
      background: #fff;
      border: 1px solid var(--line);
      padding: 1.5rem;
      margin-bottom: 2rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .edit-form input, .edit-form select, .edit-form textarea {
      padding: 0.6rem;
      border: 1px solid var(--line);
      font-family: inherit;
      font-size: 0.9rem;
      background: var(--cream);
      width: 100%;
    }
    .edit-form .full { grid-column: 1 / -1; }
    .edit-form label {
      display: block;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 0.3rem;
    }
    .edit-form button {
      background: var(--gold);
      border: 1px solid var(--gold);
      color: var(--ink);
      padding: 0.7rem 1.5rem;
      font-family: inherit;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      cursor: pointer;
      justify-self: start;
    }
    .edit-form button:hover { background: transparent; color: var(--gold); }

    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--ink);
      color: var(--cream);
      padding: 1rem 1.8rem;
      border-left: 4px solid var(--gold);
      font-size: 0.9rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      transform: translateY(200%);
      transition: transform 0.3s;
      z-index: 999;
    }
    .toast.show { transform: translateY(0); }
    .toast.error { border-left-color: var(--wine); }

    @media (max-width: 700px) {
      .edit-form { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="login-wrap" id="login-view">
    <div class="login-card">
      <h1>Admin</h1>
      <p>Sign in to manage the restaurant.</p>
      <form id="login-form">
        <div class="error" id="login-error" style="display:none;"></div>
        <label>Email</label>
        <input type="email" id="login-email" value="admin@luxuryrestaurant.com" required>
        <label>Password</label>
        <input type="password" id="login-password" placeholder="Enter password" required>
        <button type="submit">Sign In</button>
      </form>
    </div>
  </div>

  <div class="dash" id="dash-view">
    <div class="dash-header">
      <a class="brand" href="/">La Belle Époque · Admin</a>
      <div class="user">
        <span id="admin-email">—</span>
        <button id="logout-btn">Sign out</button>
      </div>
    </div>

    <div class="tabs">
      <button data-tab="menu" class="active">Menu</button>
      <button data-tab="hours">Hours</button>
      <button data-tab="reservations">Reservations</button>
      <button data-tab="orders">Orders</button>
    </div>

    <div class="tab-content active" id="tab-menu">
      <h2>Menu Items</h2>
      <form class="edit-form" id="add-item-form">
        <div class="full">
          <label>Add New Item</label>
        </div>
        <div>
          <label>Category</label>
          <select id="item-category" required></select>
        </div>
        <div>
          <label>Name</label>
          <input id="item-name" required>
        </div>
        <div class="full">
          <label>Description</label>
          <input id="item-description">
        </div>
        <div>
          <label>Price (KES)</label>
          <input id="item-price" type="number" step="0.01" min="0" required>
        </div>
        <div>
          <label>Prep minutes</label>
          <input id="item-prep" type="number" min="1" value="15">
        </div>
        <div class="full">
          <label>Image URL</label>
          <input id="item-image" placeholder="https://...">
        </div>
        <div class="full">
          <label>Dietary tags (comma-separated)</label>
          <input id="item-tags" placeholder="vegan, gluten_free">
        </div>
        <button type="submit">Add Item</button>
      </form>
      <div id="menu-table-wrap"><p class="loading">Loading…</p></div>
    </div>

    <div class="tab-content" id="tab-hours">
      <h2>Opening Hours</h2>
      <div id="hours-wrap"><p class="loading">Loading…</p></div>
    </div>

    <div class="tab-content" id="tab-reservations">
      <h2>Reservations</h2>
      <div id="reservations-wrap"><p class="loading">Loading…</p></div>
    </div>

    <div class="tab-content" id="tab-orders">
      <h2>Orders</h2>
      <div id="orders-wrap"><p class="loading">Loading…</p></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    function toast(msg, isError = false) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast show' + (isError ? ' error' : '');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.className = 'toast', 3500);
    }

    async function api(path, opts = {}) {
      const res = await fetch('/api' + path, {
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
        ...opts,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      return data;
    }

    const loginView = document.getElementById('login-view');
    const dashView = document.getElementById('dash-view');

    async function checkSession() {
      try {
        const me = await api('/admin/me');
        if (me && me.id) {
          showDashboard(me);
          return;
        }
      } catch (_) { }
      showLogin();
    }

    function showLogin() {
      loginView.style.display = 'flex';
      dashView.classList.remove('visible');
    }

    function showDashboard(admin) {
      loginView.style.display = 'none';
      dashView.classList.add('visible');
      document.getElementById('admin-email').textContent = admin.email;
      loadMenuTable();
      loadHours();
      loadReservations();
      loadOrders();
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('login-error');
      err.style.display = 'none';
      try {
        const res = await api('/admin/login', {
          method: 'POST',
          body: JSON.stringify({
            email: document.getElementById('login-email').value,
            password: document.getElementById('login-password').value,
          }),
        });
        showDashboard(res.admin);
        toast('Welcome back, ' + res.admin.full_name);
      } catch (e) {
        err.textContent = e.message;
        err.style.display = 'block';
      }
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      try { await api('/admin/logout', { method: 'POST' }); } catch (_) {}
      showLogin();
    });

    document.querySelectorAll('.tabs button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
        if (btn.dataset.tab === 'menu') loadMenuTable();
        if (btn.dataset.tab === 'hours') loadHours();
        if (btn.dataset.tab === 'reservations') loadReservations();
        if (btn.dataset.tab === 'orders') loadOrders();
      });
    });

    async function loadMenuTable() {
      const wrap = document.getElementById('menu-table-wrap');
      try {
        const data = await api('/menu');
        const sel = document.getElementById('item-category');
        sel.innerHTML = data.categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        const rows = [];
        data.categories.forEach(c => c.items.forEach(i => rows.push({ ...i, category: c.name })));

        if (!rows.length) {
          wrap.innerHTML = '<p class="empty">No items yet — add one above.</p>';
          return;
        }

        wrap.innerHTML = `
          <table class="data-table">
            <thead><tr><th>Category</th><th>Name</th><th>Price</th><th>Available</th><th>Action</th></tr></thead>
            <tbody>
              ${rows.map(r => `
                <tr>
                  <td>${r.category}</td>
                  <td><strong>${r.name}</strong><br><small style="color:var(--muted)">${r.description || ''}</small></td>
                  <td>KES ${r.price.toFixed(2)}</td>
                  <td>${r.available ? '✅' : '❌'}</td>
                  <td><button class="status-select" data-id="${r.id}" data-avail="${r.available}" onclick="toggleAvail(this)">Toggle</button></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      } catch (e) {
        wrap.innerHTML = `<p class="empty">Error: ${e.message}</p>`;
      }
    }

    window.toggleAvail = async function(btn) {
      const id = btn.dataset.id;
      const current = btn.dataset.avail === 'true';
      try {
        await api(`/admin/menu-items/${id}`, { method: 'PUT', body: JSON.stringify({ is_available: !current }) });
        toast('Item updated');
        loadMenuTable();
      } catch (e) { toast(e.message, true); }
    };

    document.getElementById('add-item-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const tags = document.getElementById('item-tags').value.split(',').map(t => t.trim()).filter(Boolean);
      try {
        await api('/admin/menu-items', {
          method: 'POST',
          body: JSON.stringify({
            category_id: parseInt(document.getElementById('item-category').value, 10),
            name: document.getElementById('item-name').value,
            description: document.getElementById('item-description').value,
            price: parseFloat(document.getElementById('item-price').value),
            prep_minutes: parseInt(document.getElementById('item-prep').value, 10) || 15,
            image_url: document.getElementById('item-image').value,
            dietary_tags: tags,
            is_available: true,
          }),
        });
        toast('Item added');
        e.target.reset();
        loadMenuTable();
      } catch (e) { toast(e.message, true); }
    });

    async function loadHours() {
      const wrap = document.getElementById('hours-wrap');
      try {
        const hours = await api('/hours');
        const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
        wrap.innerHTML = `
          <table class="data-table">
            <thead><tr><th>Day</th><th>Open</th><th>Close</th><th>Closed?</th><th></th></tr></thead>
            <tbody>
              ${hours.map(h => `
                <tr data-id="${h.day_of_week}">
                  <td>${DAYS[h.day_of_week]}</td>
                  <td><input type="time" class="status-select h-open" value="${h.open_time.slice(0,5)}"></td>
                  <td><input type="time" class="status-select h-close" value="${h.close_time.slice(0,5)}"></td>
                  <td><input type="checkbox" class="h-closed" ${h.is_closed ? 'checked' : ''}></td>
                  <td><button class="status-select" onclick="saveHours(${h.day_of_week})">Save</button></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      } catch (e) { wrap.innerHTML = `<p class="empty">Error: ${e.message}</p>`; }
    }

    window.saveHours = async function(dow) {
      const row = document.querySelector(`tr[data-id="${dow}"]`);
      try {
        await api('/admin/hours', {
          method: 'PUT',
          body: JSON.stringify({
            hours: [{
              day_of_week: dow,
              open_time: row.querySelector('.h-open').value,
              close_time: row.querySelector('.h-close').value,
              is_closed: row.querySelector('.h-closed').checked,
            }],
          }),
        });
        toast('Hours updated');
      } catch (e) { toast(e.message, true); }
    };

    async function loadReservations() {
      const wrap = document.getElementById('reservations-wrap');
      try {
        const rows = await api('/admin/reservations');
        if (!rows.length) { wrap.innerHTML = '<p class="empty">No reservations yet.</p>'; return; }
        wrap.innerHTML = `
          <table class="data-table">
            <thead><tr><th>Date</th><th>Time</th><th>Guest</th><th>Party</th><th>Status</th><th>Change</th></tr></thead>
            <tbody>
              ${rows.map(r => `
                <tr>
                  <td>${r.reservation_date}</td>
                  <td>${r.reservation_time.slice(0,5)}</td>
                  <td>${r.full_name}<br><small style="color:var(--muted)">${r.email}<br>${r.phone}</small></td>
                  <td>${r.party_size}</td>
                  <td><span class="status-pill status-${r.status}">${r.status}</span></td>
                  <td>
                    <select class="status-select" onchange="updateResStatus(${r.id}, this.value)">
                      <option value="">—</option>
                      <option value="pending">pending</option>
                      <option value="confirmed">confirmed</option>
                      <option value="seated">seated</option>
                      <option value="completed">completed</option>
                      <option value="cancelled">cancelled</option>
                    </select>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      } catch (e) { wrap.innerHTML = `<p class="empty">Error: ${e.message}</p>`; }
    }

    window.updateResStatus = async function(id, status) {
      if (!status) return;
      try {
        await api(`/admin/reservations/${id}`, { method: 'PATCH', body: JSON.stringify({ status }) });
        toast('Reservation updated');
        loadReservations();
      } catch (e) { toast(e.message, true); }
    };

    async function loadOrders() {
      const wrap = document.getElementById('orders-wrap');
      try {
        const rows = await api('/admin/orders');
        if (!rows.length) { wrap.innerHTML = '<p class="empty">No orders yet.</p>'; return; }
        wrap.innerHTML = `
          <table class="data-table">
            <thead><tr><th>Order #</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Change</th></tr></thead>
            <tbody>
              ${rows.map(o => `
                <tr>
                  <td><strong>${o.order_number}</strong><br><small>${new Date(o.created_at).toLocaleString()}</small></td>
                  <td>${o.full_name}<br><small style="color:var(--muted)">${o.phone}<br>${o.fulfillment}</small></td>
                  <td><small>${o.items.map(i => `${i.quantity}× ${i.item_name}`).join('<br>')}</small></td>
                  <td>KES ${Number(o.total).toFixed(2)}</td>
                  <td><span class="status-pill status-${o.status}">${o.status}</span></td>
                  <td>
                    <select class="status-select" onchange="updateOrderStatus(${o.id}, this.value)">
                      <option value="">—</option>
                      <option value="pending">pending</option>
                      <option value="preparing">preparing</option>
                      <option value="ready">ready</option>
                      <option value="out_for_delivery">out_for_delivery</option>
                      <option value="completed">completed</option>
                      <option value="cancelled">cancelled</option>
                    </select>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      } catch (e) { wrap.innerHTML = `<p class="empty">Error: ${e.message}</p>`; }
    }

    window.updateOrderStatus = async function(id, status) {
      if (!status) return;
      try {
        await api(`/admin/orders/${id}`, { method: 'PATCH', body: JSON.stringify({ status }) });
        toast('Order updated');
        loadOrders();
      } catch (e) { toast(e.message, true); }
    };

    checkSession();
  </script>
</body>
</html>
